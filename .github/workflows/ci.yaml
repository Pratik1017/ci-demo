name: ci-demo

on: 
  push: 
    branches: 
    - main

jobs: 
  name: flake8 check
  run-on: ubuntu-latest

  steps: 
    name: checkout code
    uses: actions/checkout@v2

    name: setup python
    uses: actions/setup-python@v3
    with: 
      python-version: "3.14"

    name: install-dep
    run: |
      python -m pip install --upgrade pip
      pip install flake8

    name: run flake8
    run: flake8
